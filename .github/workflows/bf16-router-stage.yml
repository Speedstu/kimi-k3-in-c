name: Stage adaptive router storage

on:
  push:
    branches:
      - speedboost/bf16-router

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'stage adaptive router storage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply adaptive storage patch
        run: python3 tools/apply_router_adaptive_stage.py .
      - name: Strict build
        run: |
          make clean
          make portable CFLAGS="-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -Werror -fopenmp -pthread -ffp-contract=off" -j2
      - name: Full tests
        run: make test -j2
      - name: Benchmark released-size streamed versus resident router
        env:
          OMP_NUM_THREADS: '2'
        run: |
          cc -O3 -std=gnu99 -mavx2 -mfma -fopenmp -pthread -ffp-contract=off \
             -Iinclude -Iinclude/k3 benchmarks/bench_router_storage.c build/src/core/k3_ops.o \
             -o /tmp/bench_router -lm -fopenmp -pthread
          /tmp/bench_router 10
      - name: Commit validated adaptive source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/k3/k3.h src/core/k3_ops.c src/model/k3_bind.c
          git commit -m "perf: adapt MoE router storage to resident vs streamed trunks"
          git push origin HEAD:speedboost/bf16-router
