name: Stage typed BF16 router

on:
  push:
    branches:
      - speedboost/bf16-router

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'stage typed bf16 router'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply router patch
        run: python3 tools/apply_bf16_router_stage.py .
      - name: Build
        run: make -j2
      - name: Full tests
        run: make test
      - name: Warnings as errors
        run: |
          make clean
          make portable CFLAGS="-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -Werror -fopenmp -pthread -ffp-contract=off" -j2
      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/k3/k3.h src/core/k3_ops.c src/model/k3_bind.c tests/unit/test_ops.c
          git commit -m "perf: keep exact MoE router gate in BF16"
          git push origin HEAD:speedboost/bf16-router
