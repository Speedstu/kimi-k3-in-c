name: MXFP4 direct decode probe

on:
  push:
    branches: [speedboost/mxfp4-direct-decode-probe]
    paths:
      - 'benchmarks/bench_mxfp4_direct_decode.c'
      - '.github/workflows/mxfp4-direct-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build candidate benchmark
        run: |
          set -euo pipefail
          make -j2
          cc -O3 -std=gnu99 -Wall -Wextra -Werror -mavx2 -mfma -fopenmp -pthread -ffp-contract=off \
             -Iinclude -Iinclude/k3 benchmarks/bench_mxfp4_direct_decode.c build/src/core/k3_ops.o \
             -o /tmp/bench_mxfp4_direct -lm -fopenmp -pthread
      - name: One thread
        run: OMP_NUM_THREADS=1 /tmp/bench_mxfp4_direct
      - name: Two threads
        run: OMP_NUM_THREADS=2 /tmp/bench_mxfp4_direct
      - name: Four threads
        run: OMP_NUM_THREADS=4 /tmp/bench_mxfp4_direct
