name: Stage prefill xdouble source

on:
  push:
    branches: [speedboost/prefill-xdouble]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: speedboost/prefill-xdouble
          fetch-depth: 0
      - name: Patch production prefill path
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          git diff --check
          git diff -- src/core/k3_ops.c
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/core/k3_ops.c
          git commit -m 'perf: reuse widened latents in streamed prefill'
          git push origin HEAD:speedboost/prefill-xdouble
