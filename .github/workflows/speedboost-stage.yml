name: Apply speedboost stage

on:
  push:
    branches:
      - speedboost/k3-fast-exact-draft

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'stage speedboost patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited patch
        run: python3 tools/apply_speedboost_stage.py .

      - name: Build
        run: make -j2

      - name: Test
        run: make test

      - name: Commit validated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/k3/k3.h src/core/k3_ops.c src/cli/k3_run.c
          git commit -m "perf: speed up exact KDA and add cheap draft top-k"
          git push origin HEAD:speedboost/k3-fast-exact-draft
