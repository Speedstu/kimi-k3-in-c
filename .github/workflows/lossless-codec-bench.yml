name: Bench lossless BF16 dictionary codec

on:
  push:
    branches:
      - speedboost/lossless-trunk-codec

jobs:
  bench:
    if: github.event.head_commit.message == 'bench lossless bf16 dictionary codec'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build prototype
        run: cc -O3 -mavx2 -Wall -Wextra -Werror benchmarks/bench_bf16_dict_codec.c -o /tmp/bench_bf16_dict_codec
      - name: Benchmark 256 MiB, 5 repeats
        run: /tmp/bench_bf16_dict_codec 256 5

# This workflow is intentionally branch-local while the codec remains an experiment.
