name: Apply Q4 draft stage

on:
  push:
    branches:
      - speedboost/k3-fast-exact-draft

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'stage q4 draft patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Q4 draft patch
        run: python3 tools/apply_q4_draft_stage.py .

      - name: Check Q4 packer syntax
        run: python3 -m py_compile tools/q4_trunk.py

      - name: Build
        run: make -j2

      - name: Test
        run: make test

      - name: Commit validated Q4 feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/k3/k3.h src/io/k3_st.h src/io/k3_trunk.c src/core/k3_ops.c src/model/k3_bind.c tests/unit/test_ops.c tools/q4_trunk.py
          git commit -m "feat: add groupwise Q4 speculative draft trunk"
          git push origin HEAD:speedboost/k3-fast-exact-draft
