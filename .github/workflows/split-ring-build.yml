name: Split ring native builds

on:
  push:
    branches: [speedboost/laptop-split-ring]
    paths:
      - 'src/io/k3_trunk.c'
      - 'src/io/k3_trunk.h'
      - '.github/workflows/split-ring-build.yml'
  pull_request:
    paths:
      - 'src/io/k3_trunk.c'
      - 'src/io/k3_trunk.h'
      - '.github/workflows/split-ring-build.yml'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libomp-dev
      - name: Strict Linux build
        run: |
          make clean
          make ARCH='-msse2' CFLAGS='-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -Werror -msse2 -fopenmp -pthread -ffp-contract=off' -j2

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
      - name: Strict native Windows build
        shell: msys2 {0}
        run: |
          make clean
          make CC=gcc ARCH='-msse2' CFLAGS='-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -Werror -msse2 -fopenmp -pthread -ffp-contract=off' -j2
