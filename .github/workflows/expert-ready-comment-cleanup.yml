name: Expert pipeline comment cleanup

on:
  push:
    branches: [speedboost/expert-ready-pipeline]
    paths:
      - '.github/workflows/expert-ready-comment-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: speedboost/expert-ready-pipeline
      - name: Update stale MoE comment and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/k3_ops.c')
          s=p.read_text()
          old='''        /* If the cache supports async top-k prefetch, start it as soon as routing has\n         * identified the experts. Nothing below touches the cache until prefetch_wait. */\n'''
          new='''        /* Start top-k I/O as soon as routing identifies the experts. Down/shared compute\n         * is cache-independent; a pipeline-capable source then publishes experts one by one,\n         * while older sources retain the whole-batch barrier before routed computation. */\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one stale comment, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/expert-ready-comment-cleanup.yml
          git add src/core/k3_ops.c
          git commit -m 'docs: clarify expert pipeline synchronization'
          git push origin HEAD:speedboost/expert-ready-pipeline
