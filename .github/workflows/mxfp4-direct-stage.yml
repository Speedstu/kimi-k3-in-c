name: MXFP4 direct source staging

on:
  push:
    branches: [speedboost/mxfp4-direct-decode]
    paths:
      - '.github/workflows/mxfp4-direct-stage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: speedboost/mxfp4-direct-decode
      - name: Apply patch and self-remove helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/mxfp4_direct_stage.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mxfp4-direct-stage.yml tools/mxfp4_direct_stage.py
          git add src/core/k3_ops.c
          git commit -m 'perf: decode K3 MXFP4 groups directly with AVX2'
          git push origin HEAD:speedboost/mxfp4-direct-decode
