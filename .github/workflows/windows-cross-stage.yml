name: Windows MinGW cross stage

on:
  push:
    branches: [feature/windows-native-runtime]

jobs:
  mingw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install MinGW-w64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 make
      - name: Cross-build Windows engine
        run: |
          x86_64-w64-mingw32-gcc --version
          make CC=x86_64-w64-mingw32-gcc ARCH='-msse2' -j2
