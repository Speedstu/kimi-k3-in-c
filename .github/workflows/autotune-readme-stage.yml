name: Autotune README staging

on:
  push:
    branches: [speedboost/real-hardware-autotune]
    paths:
      - 'tools/_stage_autotune_readme.py'
      - '.github/workflows/autotune-readme-stage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: speedboost/real-hardware-autotune
          fetch-depth: 0
      - name: Apply README patch and self-remove
        run: |
          set -euo pipefail
          python tools/_stage_autotune_readme.py
          rm tools/_stage_autotune_readme.py .github/workflows/autotune-readme-stage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md tools/_stage_autotune_readme.py .github/workflows/autotune-readme-stage.yml
          git commit -m 'docs: make CPU and I/O autotuning the recommended path'
          git push origin HEAD:speedboost/real-hardware-autotune
