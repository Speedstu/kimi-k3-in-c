name: Stage large-context resident worker

on:
  push:
    branches: ['feature/large-context-resident']
    paths:
      - 'tools/apply_large_context_stage.py'
      - '.github/workflows/large-context-stage.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/large-context-resident
      - name: Apply guarded large-context patch
        run: python3 tools/apply_large_context_stage.py
      - name: Build tests and strict warnings
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libomp-dev
          make ARCH='-mavx2 -mfma' -j"$(nproc)"
          make ARCH='-mavx2 -mfma' test -j"$(nproc)"
          rm -rf build bin
          make ARCH='-mavx2 -mfma' CFLAGS='-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -mavx2 -mfma -fopenmp -pthread -ffp-contract=off -Werror' -j"$(nproc)"
      - name: CMake parity
        run: |
          cmake -S . -B /tmp/k3-large-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/k3-large-cmake -j"$(nproc)"
          ctest --test-dir /tmp/k3-large-cmake --output-on-failure
      - name: Commit validated source
        run: |
          git config user.name Speedstu
          git config user.email '164693733+Speedstu@users.noreply.github.com'
          git add src/cli/k3_worker.c
          git diff --cached --quiet || git commit -m 'feat: reserve up to 1M resident context safely and reclaim dead KV pages'
          git push origin HEAD:feature/large-context-resident
