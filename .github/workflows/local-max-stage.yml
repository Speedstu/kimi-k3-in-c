name: Stage local K3 max parity

on:
  push:
    branches: [feature/local-k3-max-parity]
    paths:
      - tools/apply_local_max_stage_v2.py
      - .github/workflows/local-max-stage.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/local-k3-max-parity

      - name: Apply guarded source patch
        run: python3 tools/apply_local_max_stage_v2.py

      - name: Build and run weightless gates
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libomp-dev
          make ARCH="-mavx2 -mfma" -j"$(nproc)"
          make ARCH="-mavx2 -mfma" test -j"$(nproc)"
          ./bin/test_sample

      - name: Strict warnings
        run: |
          make clean
          make portable CFLAGS="-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -Werror -fopenmp -ffp-contract=off" -j"$(nproc)"

      - name: CMake parity
        run: |
          cmake -S . -B /tmp/k3-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/k3-cmake -j"$(nproc)"
          ctest --test-dir /tmp/k3-cmake --output-on-failure

      - name: Python local framework gates
        run: |
          python3 -m py_compile local/k3_local.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          p = Path('local/k3_local.py')
          spec = importlib.util.spec_from_file_location('k3_local', p)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          sample = (
              'I should inspect the repository.'
              '<|close|>think<|sep|>'
              '<|open|>tools<|sep|>'
              '<|open|>call tool="Bash" index="1"<|sep|>'
              '<|open|>argument key="command" type="string"<|sep|>git status'
              '<|close|>argument<|sep|>'
              '<|close|>call<|sep|>'
              '<|close|>tools<|sep|>'
          )
          msg = mod.parse_xtml(sample)
          assert msg['reasoning_content'] == 'I should inspect the repository.'
          assert msg['tool_calls'][0]['function']['name'] == 'Bash'
          assert 'git status' in msg['tool_calls'][0]['function']['arguments']
          print('XTML parser smoke: PASS')
          PY
          grep -q -- '--temperature' <(./bin/k3 --help 2>&1)
          grep -q -- '--ids-file' <(./bin/k3 --help 2>&1)
          grep -q -- '--stop-id' <(./bin/k3 --help 2>&1)

      - name: Commit materialized feature
        run: |
          git config user.name Speedstu
          git config user.email '164693733+Speedstu@users.noreply.github.com'
          git add Makefile CMakeLists.txt src/cli/k3_run.c src/core/k3_sample.c \
                  include/k3/k3_sample.h tests/unit/test_sample.c local/k3_local.py \
                  .github/workflows/ci.yml
          git diff --cached --check
          git commit -m 'feat: local K3 max-parity inference and API-compatible runtime [stage-applied]'
          git push origin HEAD:feature/local-k3-max-parity
