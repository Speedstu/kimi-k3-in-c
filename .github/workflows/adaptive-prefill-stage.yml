name: Stage adaptive prefill

on:
  push:
    branches: ['feature/adaptive-prefill-chunk']
    paths:
      - 'tools/apply_adaptive_prefill_stage.py'
      - '.github/workflows/adaptive-prefill-stage.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/adaptive-prefill-chunk
      - name: Apply guarded adaptive prefill patch
        run: python3 tools/apply_adaptive_prefill_stage.py
      - name: Build tests and strict warnings
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libomp-dev
          make ARCH='-mavx2 -mfma' -j"$(nproc)"
          make ARCH='-mavx2 -mfma' test -j"$(nproc)"
          rm -rf build bin
          make ARCH='-mavx2 -mfma' CFLAGS='-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -mavx2 -mfma -fopenmp -pthread -ffp-contract=off -Werror' -j"$(nproc)"
      - name: CMake parity
        run: |
          cmake -S . -B /tmp/k3-prefill-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/k3-prefill-cmake -j"$(nproc)"
          ctest --test-dir /tmp/k3-prefill-cmake --output-on-failure
      - name: Commit validated source
        run: |
          git config user.name Speedstu
          git config user.email '164693733+Speedstu@users.noreply.github.com'
          git add src/cli/k3_worker.c
          git diff --cached --quiet || git commit -m 'perf: adapt resident prefill chunk to transient RAM budget'
          git push origin HEAD:feature/adaptive-prefill-chunk
