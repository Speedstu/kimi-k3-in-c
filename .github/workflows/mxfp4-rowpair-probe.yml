name: MXFP4 row-pair probe

on:
  push:
    branches: [speedboost/mxfp4-rowpair-probe]
    paths:
      - 'benchmarks/bench_mxfp4_rowpair.c'
      - '.github/workflows/mxfp4-rowpair-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cc -O3 -std=gnu99 -Wall -Wextra -Werror -mavx2 -mfma -fopenmp -pthread -ffp-contract=off benchmarks/bench_mxfp4_rowpair.c -o /tmp/mx_rowpair -lm -fopenmp -pthread
      - name: One thread
        run: OMP_NUM_THREADS=1 /tmp/mx_rowpair
      - name: Two threads
        run: OMP_NUM_THREADS=2 /tmp/mx_rowpair
      - name: Four threads
        run: OMP_NUM_THREADS=4 /tmp/mx_rowpair
      - name: Eight threads
        run: OMP_NUM_THREADS=8 /tmp/mx_rowpair
