name: Stage resume-aware memory plan

on:
  push:
    branches: [feature/local-k3-max-parity]
    paths:
      - tools/apply_resume_plan_stage.py
      - .github/workflows/resume-plan-stage.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/local-k3-max-parity

      - name: Apply guarded patch
        run: python3 tools/apply_resume_plan_stage.py

      - name: Build and test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libomp-dev
          make ARCH="-mavx2 -mfma" -j"$(nproc)"
          make ARCH="-mavx2 -mfma" test -j"$(nproc)"

      - name: Strict build
        run: |
          make clean
          make portable CFLAGS="-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -Werror -fopenmp -ffp-contract=off" -j"$(nproc)"

      - name: Python framework syntax
        run: python3 -m py_compile local/k3_local.py

      - name: Commit source only
        run: |
          git config user.name Speedstu
          git config user.email '164693733+Speedstu@users.noreply.github.com'
          git add src/cli/k3_run.c
          git diff --cached --check
          git commit -m 'fix: account for resumed context in memory guards [stage-applied]'
          git push origin HEAD:feature/local-k3-max-parity
