name: K3 vision bridge staging

on:
  push:
    branches: [speedboost/k3-vision-input]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply bridge and unit gates
        run: |
          set -euo pipefail
          python tools/patch_k3_vision_bridge.py
          python -m pip install --quiet numpy
          python -m compileall -q local/ tests/python/
          python -m unittest discover -s tests/python -p 'test_*.py' -v
      - name: Persist validated bridge
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local/k3_local.py
          git commit -m 'feat: route K3 image input through official vision frontend' || true
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}
