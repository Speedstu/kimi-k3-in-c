name: K3 vision bridge parity

on:
  push:
    branches: [speedboost/k3-vision-input]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Stage bridge transform
        run: python tools/patch_k3_vision_bridge.py
      - name: Unit gates
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy
          python -m compileall -q local/ tests/python/
          python -m unittest discover -s tests/python -p 'test_*.py' -v
