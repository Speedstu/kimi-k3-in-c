name: Stage worker reuse metric

on:
  push:
    branches: ['feature/resident-local-worker']
    paths:
      - 'tools/apply_worker_reuse_metric_stage.py'
      - '.github/workflows/worker-reuse-stage.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/resident-local-worker
      - name: Apply metric patch
        run: python3 tools/apply_worker_reuse_metric_stage.py
      - name: Build strict
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libomp-dev
          make ARCH='-mavx2 -mfma' CFLAGS='-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -mavx2 -mfma -fopenmp -pthread -ffp-contract=off -Werror' -j"$(nproc)"
      - name: Commit validated source
        run: |
          git config user.name Speedstu
          git config user.email '164693733+Speedstu@users.noreply.github.com'
          git add src/cli/k3_worker.c
          git diff --cached --quiet || git commit -m 'fix: report resident prefix reuse in tokens'
          git push origin HEAD:feature/resident-local-worker
