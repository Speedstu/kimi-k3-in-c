name: Greedy speculation 32 parity

on:
  push:
    branches: [speedboost/greedy-spec32]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exactness:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Apply greedy spec32 transform
        run: python tools/patch_greedy_spec32.py

      - name: Strict AVX2 build and full oracle
        run: |
          set -euo pipefail
          make clean
          make ARCH='-mavx2 -mfma' CFLAGS='-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -Werror -mavx2 -mfma -fopenmp -pthread -ffp-contract=off' -j2
          make ARCH='-mavx2 -mfma' CFLAGS='-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -Werror -mavx2 -mfma -fopenmp -pthread -ffp-contract=off' test -j2

      - name: Build exact tiny streamed fixture
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          rm -rf /tmp/k3spec32 /tmp/k3spec32-trunk /tmp/k3spec32-out
          mkdir -p /tmp/k3spec32-out
          python tools/make_tiny_checkpoint.py /tmp/k3spec32 --seed 2100 \
            --prompt-ids 3,7,11,5,9,2,4,6,8,10,12,14
          NLAYERS=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/k3spec32/config.json'))['num_hidden_layers'])
          PY
          )
          python tools/pack_trunk.py /tmp/k3spec32 /tmp/k3spec32-trunk "$NLAYERS"

      - name: Fixed greedy spec16 exercises width above eight and remains exact
        run: |
          set -euo pipefail
          D=/tmp/k3spec32-out
          IDS='3,7,11,5,9,2,4,6,8,10,12,14'
          BASE='/tmp/k3spec32 --trunk /tmp/k3spec32-trunk --trunk-gb 0.05 --cache-gb 0.01 --ids 3,7,11,5,9,2,4,6,8,10,12,14 --gen 40 --incremental --threads 1 --temperature 0'
          DRAFT='--draft-trunk /tmp/k3spec32-trunk --draft-trunk-gb 0.05 --draft-topk 2'
          ./bin/k3 $BASE --out "$D/serial.json" >"$D/serial.log" 2>&1
          ./bin/k3 $BASE $DRAFT --spec 16 --out "$D/spec16.json" >"$D/spec16.log" 2>&1
          python - <<'PY'
          import json
          d='/tmp/k3spec32-out'
          a=json.load(open(d+'/serial.json')); b=json.load(open(d+'/spec16.json'))
          assert b['generated_ids'] == a['generated_ids'], (a['generated_ids'], b['generated_ids'])
          assert b['full_ids'] == a['full_ids']
          assert b['spec_peak_width'] > 8, b['spec_peak_width']
          assert b['spec_peak_width'] <= 16
          print('GREEDY SPEC16 EXACT PARITY PASS', {'peak_width':b['spec_peak_width']})
          PY

      - name: Default adaptive greedy ceiling is 32 and remains exact
        run: |
          set -euo pipefail
          D=/tmp/k3spec32-out
          BASE='/tmp/k3spec32 --trunk /tmp/k3spec32-trunk --trunk-gb 0.05 --cache-gb 0.01 --ids 3,7,11,5,9,2,4,6,8,10,12,14 --gen 40 --incremental --threads 1 --temperature 0'
          DRAFT='--draft-trunk /tmp/k3spec32-trunk --draft-trunk-gb 0.05 --draft-topk 2'
          ./bin/k3 $BASE $DRAFT --spec-auto --out "$D/auto.json" >"$D/auto.log" 2>&1
          python - <<'PY'
          import json
          d='/tmp/k3spec32-out'
          a=json.load(open(d+'/serial.json')); x=json.load(open(d+'/auto.json'))
          assert x['generated_ids'] == a['generated_ids']
          assert x['full_ids'] == a['full_ids']
          assert x['spec_auto'] == 1
          assert x['spec_auto_limit'] == 32, x['spec_auto_limit']
          assert 1 <= x['spec_peak_width'] <= 32
          print('GREEDY SPEC-AUTO 32 CEILING PASS', {
              'limit':x['spec_auto_limit'], 'peak_width':x['spec_peak_width']})
          PY

      - name: Sampled spec16 is exactly the historical spec8 behavior
        run: |
          set -euo pipefail
          D=/tmp/k3spec32-out
          BASE='/tmp/k3spec32 --trunk /tmp/k3spec32-trunk --trunk-gb 0.05 --cache-gb 0.01 --ids 3,7,11,5,9,2,4,6 --gen 20 --incremental --threads 1 --temperature 1 --top-p 0.95 --seed 424242'
          DRAFT='--draft-trunk /tmp/k3spec32-trunk --draft-trunk-gb 0.05 --draft-topk 2'
          ./bin/k3 $BASE $DRAFT --spec 8 --out "$D/sample8.json" >"$D/sample8.log" 2>&1
          ./bin/k3 $BASE $DRAFT --spec 16 --out "$D/sample16.json" >"$D/sample16.log" 2>&1
          python - <<'PY'
          import json
          d='/tmp/k3spec32-out'
          a=json.load(open(d+'/sample8.json')); b=json.load(open(d+'/sample16.json'))
          assert b['generated_ids'] == a['generated_ids'], (a['generated_ids'], b['generated_ids'])
          assert b['full_ids'] == a['full_ids']
          assert a['spec_peak_width'] <= 8 and b['spec_peak_width'] <= 8, (
              a['spec_peak_width'], b['spec_peak_width'])
          print('SAMPLED SPEC16 LEGACY CAP8 PARITY PASS', {
              'spec8_peak':a['spec_peak_width'], 'spec16_peak':b['spec_peak_width']})
          PY

      - name: Persist validated source and make gate permanent
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cli/k3_run.c
          git commit -m 'perf: widen exact greedy speculation to 32' || true
          rm -f tools/patch_greedy_spec32.py
          cat > .github/workflows/greedy-spec32.yml <<'YAML'
          name: Greedy speculation 32 parity
          on:
            workflow_dispatch:
            pull_request:
              paths:
                - 'src/cli/k3_run.c'
                - '.github/workflows/greedy-spec32.yml'
          permissions:
            contents: read
          jobs:
            exactness:
              runs-on: ubuntu-latest
              timeout-minutes: 35
              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-python@v7
                  with:
                    python-version: '3.12'
                - name: Strict AVX2 build and full oracle
                  run: |
                    set -euo pipefail
                    make clean
                    make ARCH='-mavx2 -mfma' CFLAGS='-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -Werror -mavx2 -mfma -fopenmp -pthread -ffp-contract=off' -j2
                    make ARCH='-mavx2 -mfma' CFLAGS='-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -Werror -mavx2 -mfma -fopenmp -pthread -ffp-contract=off' test -j2
                - name: Greedy width above eight is exact and sampled width remains eight
                  run: |
                    set -euo pipefail
                    python -m pip install --quiet numpy
                    python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
                    rm -rf /tmp/k3spec32 /tmp/k3spec32-trunk /tmp/k3spec32-out
                    mkdir -p /tmp/k3spec32-out
                    python tools/make_tiny_checkpoint.py /tmp/k3spec32 --seed 2100 --prompt-ids 3,7,11,5,9,2,4,6,8,10,12,14
                    NLAYERS=$(python - <<'PY'
                    import json
                    print(json.load(open('/tmp/k3spec32/config.json'))['num_hidden_layers'])
                    PY
                    )
                    python tools/pack_trunk.py /tmp/k3spec32 /tmp/k3spec32-trunk "$NLAYERS"
                    G='/tmp/k3spec32 --trunk /tmp/k3spec32-trunk --trunk-gb 0.05 --cache-gb 0.01 --ids 3,7,11,5,9,2,4,6,8,10,12,14 --gen 40 --incremental --threads 1 --temperature 0'
                    D='--draft-trunk /tmp/k3spec32-trunk --draft-trunk-gb 0.05 --draft-topk 2'
                    ./bin/k3 $G --out /tmp/k3spec32-out/serial.json >/tmp/k3spec32-out/serial.log 2>&1
                    ./bin/k3 $G $D --spec 16 --out /tmp/k3spec32-out/spec16.json >/tmp/k3spec32-out/spec16.log 2>&1
                    ./bin/k3 $G $D --spec-auto --out /tmp/k3spec32-out/auto.json >/tmp/k3spec32-out/auto.log 2>&1
                    S='/tmp/k3spec32 --trunk /tmp/k3spec32-trunk --trunk-gb 0.05 --cache-gb 0.01 --ids 3,7,11,5,9,2,4,6 --gen 20 --incremental --threads 1 --temperature 1 --top-p 0.95 --seed 424242'
                    ./bin/k3 $S $D --spec 8 --out /tmp/k3spec32-out/s8.json >/tmp/k3spec32-out/s8.log 2>&1
                    ./bin/k3 $S $D --spec 16 --out /tmp/k3spec32-out/s16.json >/tmp/k3spec32-out/s16.log 2>&1
                    python - <<'PY'
                    import json
                    d='/tmp/k3spec32-out/'
                    serial=json.load(open(d+'serial.json')); wide=json.load(open(d+'spec16.json')); auto=json.load(open(d+'auto.json'))
                    s8=json.load(open(d+'s8.json')); s16=json.load(open(d+'s16.json'))
                    assert wide['generated_ids']==serial['generated_ids'] and wide['full_ids']==serial['full_ids']
                    assert wide['spec_peak_width']>8
                    assert auto['generated_ids']==serial['generated_ids'] and auto['full_ids']==serial['full_ids']
                    assert auto['spec_auto_limit']==32
                    assert s8['generated_ids']==s16['generated_ids'] and s8['full_ids']==s16['full_ids']
                    assert s8['spec_peak_width']<=8 and s16['spec_peak_width']<=8
                    print('GREEDY SPEC32 + SAMPLED CAP8 PARITY PASS')
                    PY
          YAML
          git add -A
          git commit -m 'ci: make greedy spec32 gate permanent' || true
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}
