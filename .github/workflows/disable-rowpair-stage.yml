name: Disable row-pair staging

on:
  push:
    branches: [speedboost/disable-rowpair-regression]
    paths:
      - 'tools/_stage_disable_rowpair.py'
      - '.github/workflows/disable-rowpair-stage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: speedboost/disable-rowpair-regression
          fetch-depth: 0
      - name: Apply rollback and self-remove
        run: |
          set -euo pipefail
          python tools/_stage_disable_rowpair.py
          rm tools/_stage_disable_rowpair.py .github/workflows/disable-rowpair-stage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/k3_ops.c tools/_stage_disable_rowpair.py .github/workflows/disable-rowpair-stage.yml
          git commit -m 'perf: keep slower MXFP4 row-pair path opt-in only'
          git push origin HEAD:speedboost/disable-rowpair-regression
