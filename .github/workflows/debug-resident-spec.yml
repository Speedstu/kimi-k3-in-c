name: Debug resident speculation

on:
  push:
    branches: ['feature/resident-sampled-draft']
    paths:
      - 'tools/debug_resident_spec_stage.py'
      - '.github/workflows/debug-resident-spec.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/resident-sampled-draft
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Inject temporary traces and build
        run: |
          python tools/debug_resident_spec_stage.py
          python -m pip install --quiet numpy
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libomp-dev
          make ARCH='-mavx2 -mfma' -j"$(nproc)"
      - name: Tiny checkpoint and draft
        run: |
          python tools/make_tiny_checkpoint.py /tmp/k3tiny --seed 1234 --prompt-ids 3,7,11 >/dev/null
          NLAYERS=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/k3tiny/config.json'))['num_hidden_layers'])
          PY
          )
          python tools/pack_trunk.py /tmp/k3tiny /tmp/k3tiny-trunk "$NLAYERS" >/dev/null
          python tools/qdq_trunk.py /tmp/k3tiny-trunk /tmp/k3tiny-draft --bits 4 --group 0 >/dev/null
      - name: Trace first sampled request
        env:
          K3_TRACE_SPEC: '1'
        run: |
          echo '=== ONE SHOT ==='
          ./bin/k3 /tmp/k3tiny --trunk /tmp/k3tiny-trunk --trunk-gb .05 --cache-gb .05 \
            --draft-trunk /tmp/k3tiny-draft --draft-trunk-gb .05 --draft-topk 1 --spec 2 \
            --ids 3,7,11 --gen 6 --incremental --temperature 1 --top-p .95 --seed 987654 \
            --out /tmp/one.json 2>&1 | grep -E 'TRACE|hybrid decode|^[0-9]+[[:space:]]' || true
          cat /tmp/one.json
          echo '=== WORKER ==='
          { printf 'REQ 1 3 6 1 .95 987654 -1\n3 7 11\n'; printf 'QUIT\n'; } | \
            ./bin/k3-worker /tmp/k3tiny --trunk /tmp/k3tiny-trunk --trunk-gb .05 --cache-gb .05 \
              --context 64 --draft-trunk /tmp/k3tiny-draft --draft-trunk-gb .05 \
              --draft-topk 1 --spec 2 2>&1 | grep -E 'TRACE|@K3(TOKEN|DRAFT|DONE|ERROR)'
