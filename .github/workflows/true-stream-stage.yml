name: Stage true local streaming

on:
  push:
    branches: [feature/local-true-streaming]
    paths:
      - tools/apply_true_stream_stage.py
      - .github/workflows/true-stream-stage.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/local-true-streaming
      - name: Apply guarded patch
        run: python3 tools/apply_true_stream_stage.py
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python gates
        run: |
          python -m pip install --quiet ruff
          ruff check local/ tests/python/ --output-format=github
          python -m compileall -q local/ tests/python/
          python -m unittest discover -s tests/python -p 'test_*.py' -v
      - name: C build/tests and strict warnings
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libomp-dev
          make ARCH='-mavx2 -mfma' -j"$(nproc)"
          make ARCH='-mavx2 -mfma' test -j"$(nproc)"
          make clean
          make portable CFLAGS="-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -Werror -fopenmp -ffp-contract=off" -j"$(nproc)"
      - name: Materialize source
        run: |
          # GitHub's Actions token cannot update workflow files. The same validated
          # local-parity.yml change is applied separately through the GitHub connector.
          git restore .github/workflows/local-parity.yml
          git config user.name Speedstu
          git config user.email '164693733+Speedstu@users.noreply.github.com'
          git add src/cli/k3_run.c local/k3_local.py tests/python/test_local_bridge.py
          git diff --cached --check
          git commit -m 'feat: stream verified K3 tokens to local SSE clients [stage-applied]'
          git push origin HEAD:feature/local-true-streaming
