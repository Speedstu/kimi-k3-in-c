name: Split ring source staging

on:
  push:
    branches: [speedboost/laptop-split-ring]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: speedboost/laptop-split-ring
      - name: Apply source patch once
        run: python3 tools/split_ring_stage_patch.py
      - name: Commit staged sources if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'split-ring sources already staged'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/io/k3_trunk.c src/io/k3_trunk.h tools/make_tiny_checkpoint.py
          git commit -m 'perf: reuse oversized first-layer arena as two streaming slots'
          git push origin HEAD:speedboost/laptop-split-ring
