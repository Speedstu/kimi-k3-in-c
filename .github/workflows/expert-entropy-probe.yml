name: Probe real MXFP4 expert entropy

on:
  push:
    branches:
      - speedboost/expert-lossless-probe

jobs:
  probe:
    if: github.event.head_commit.message == 'probe real MXFP4 expert entropy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Analyze released-checkpoint MXFP4 fixture
        run: |
          python3 - <<'PY'
          import json, math, collections
          x = json.load(open('tests/fixtures/mxfp4.json'))
          packed = x['packed']['data'] if isinstance(x['packed'], dict) else x['packed']
          scales = x['scales']['data'] if isinstance(x['scales'], dict) else x['scales']
          nib = []
          for b in packed:
              nib.append(b & 15)
              nib.append(b >> 4)
          def entropy(vals):
              c=collections.Counter(vals); n=len(vals)
              return -sum((v/n)*math.log2(v/n) for v in c.values()), c
          H,c=entropy(nib)
          Hs,cs=entropy(scales)
          print('source:', x.get('source'))
          print('logical weights:', len(nib), 'packed bytes:', len(packed), 'scale bytes:', len(scales))
          print(f'nibble entropy: {H:.4f} bits/weight (raw=4) theoretical nibble saving={100*(1-H/4):.2f}%')
          print('nibble histogram / coverage:')
          total=len(nib); cum=0
          for q,n in c.most_common():
              cum += n
              print(f'  code {q:2d}: {n:7d} {100*n/total:6.2f}% cumulative={100*cum/total:6.2f}%')
          print(f'scale entropy: {Hs:.4f} bits/scale (raw=8), one scale/32 weights')
          print('top scale bytes:', cs.most_common(16))
          print('\nFixed dictionary escape schemes (not entropy coder):')
          cov=[]; cum=0
          for _,n in c.most_common():
              cum+=n; cov.append(cum/total)
          for bits,k in [(1,1),(2,3),(3,7)]:
              p_escape=1-cov[k-1]
              bpw=bits + 4*p_escape
              # total expert bits/weight includes one 8-bit scale per 32 weights
              total_bpw=bpw + 8/32
              raw_total=4+8/32
              print(f'  {bits}-bit top-{k} + 4-bit escape: coverage={100*cov[k-1]:.2f}% '
                    f'nibble={bpw:.4f} bpw total={total_bpw:.4f} vs {raw_total:.4f} '
                    f'saving={100*(1-total_bpw/raw_total):.2f}%')
          # Shannon lower bound including independently-coded scale stream.
          lower=H + Hs/32
          raw=4+8/32
          print(f'\nShannon lower bound treating nibble/scale independently: {lower:.4f} vs {raw:.4f} bits/weight; max theoretical total saving={100*(1-lower/raw):.2f}%')
          PY
