name: Prefill expert-wave staging

on:
  push:
    branches: [speedboost/prefill-expert-waves]
    paths:
      - 'tools/_stage_prefill_expert_waves.py'
      - '.github/workflows/prefill-expert-waves-stage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: speedboost/prefill-expert-waves
          fetch-depth: 0
      - name: Apply patch and self-remove
        run: |
          set -euo pipefail
          python tools/_stage_prefill_expert_waves.py
          rm tools/_stage_prefill_expert_waves.py .github/workflows/prefill-expert-waves-stage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/k3_ops.c tools/_stage_prefill_expert_waves.py .github/workflows/prefill-expert-waves-stage.yml
          git commit -m 'perf: pipeline all unique experts during batched prefill'
          git push origin HEAD:speedboost/prefill-expert-waves
