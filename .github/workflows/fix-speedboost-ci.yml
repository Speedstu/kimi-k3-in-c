name: Fix speedboost CI

on:
  push:
    branches:
      - speedboost/k3-fast-exact-draft

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'stage speedboost ci fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Update suite count
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          s = p.read_text()
          old = '22 passed, 0 failed, 0 skipped'
          assert s.count(old) == 2, s.count(old)
          p.write_text(s.replace(old, '23 passed, 0 failed, 0 skipped'))
          PY
      - name: Fix and verify Python lint
        run: |
          pip install --quiet ruff
          ruff check tools/q4_trunk.py --fix
          ruff format tools/q4_trunk.py
          ruff check tools/ --output-format=github
          python -m compileall -q tools/
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml tools/q4_trunk.py
          git commit -m "ci: gate Q4 test and lint the draft packer"
          git push origin HEAD:speedboost/k3-fast-exact-draft
