name: Resident worker parity

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'src/cli/k3_worker.c'
      - 'src/cli/k3_run.c'
      - 'src/core/k3_sample.c'
      - 'local/k3_local.py'
      - 'Makefile'
      - 'CMakeLists.txt'
      - '.github/workflows/worker-parity.yml'
  pull_request:
    paths:
      - 'src/cli/k3_worker.c'
      - 'src/cli/k3_run.c'
      - 'src/core/k3_sample.c'
      - 'local/k3_local.py'
      - 'Makefile'
      - 'CMakeLists.txt'
      - '.github/workflows/worker-parity.yml'

permissions:
  contents: read

jobs:
  tiny-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Dependencies and build
        run: |
          python -m pip install --quiet numpy
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libomp-dev
          make ARCH='-mavx2 -mfma' -j"$(nproc)"
      - name: Generate tiny K3, exact trunk, and approximate draft
        run: |
          python tools/make_tiny_checkpoint.py /tmp/k3tiny --seed 1234 --prompt-ids 3,7,11
          NLAYERS=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/k3tiny/config.json'))['num_hidden_layers'])
          PY
          )
          python tools/pack_trunk.py /tmp/k3tiny /tmp/k3tiny-trunk "$NLAYERS"
          python tools/qdq_trunk.py /tmp/k3tiny-trunk /tmp/k3tiny-draft --bits 4 --group 0
      - name: Resident worker equals one-shot exact engine
        run: |
          python - <<'PY'
          import importlib.util, json, subprocess, sys, tempfile
          from pathlib import Path

          MODEL='/tmp/k3tiny'; TRUNK='/tmp/k3tiny-trunk'
          COMMON=[MODEL,'--trunk',TRUNK,'--trunk-gb','0.05','--cache-gb','0.05']

          def oneshot(ids, gen, temp=0.0, top_p=1.0, seed=1, extra=()):
              with tempfile.NamedTemporaryFile(suffix='.json') as f:
                  cmd=['./bin/k3',*COMMON,'--ids',','.join(map(str,ids)),'--gen',str(gen),
                       '--incremental','--temperature',str(temp),'--top-p',str(top_p),
                       '--seed',str(seed),'--out',f.name,*extra]
                  subprocess.run(cmd,check=True,stdout=subprocess.DEVNULL)
                  return json.load(open(f.name))['generated_ids']

          def start_worker(extra=()):
              p=subprocess.Popen(['./bin/k3-worker',*COMMON,'--context','64',*extra],
                                 stdin=subprocess.PIPE,stdout=subprocess.PIPE,
                                 stderr=subprocess.STDOUT,text=True,bufsize=1)
              assert p.stdin and p.stdout
              for line in p.stdout:
                  if line.startswith('@K3READY '): return p
              raise AssertionError('worker exited before READY')

          rid=[0]
          def req(p, ids, gen, temp=0.0, top_p=1.0, seed=1, stop=-1):
              rid[0]+=1; r=rid[0]
              p.stdin.write(f'REQ {r} {len(ids)} {gen} {temp} {top_p} {seed} {stop}\n')
              p.stdin.write(' '.join(map(str,ids))+'\n'); p.stdin.flush()
              out=[]; reused=None; draft=None
              for line in p.stdout:
                  if line.startswith(f'@K3TOKEN {r} '): out.append(int(line.split()[2]))
                  elif line.startswith(f'@K3DRAFT {r} '):
                      x=line.split(); draft=(int(x[2]),int(x[3]),int(x[4]))
                  elif line.startswith(f'@K3ERROR {r} '): raise AssertionError(line)
                  elif line.startswith(f'@K3DONE {r} '):
                      reused=int(line.split()[4]); break
              return out,reused,draft

          a=[3,7,11]
          p=start_worker()
          w1,reuse,_=req(p,a,2); ref1=oneshot(a,2)
          assert w1==ref1,(w1,ref1); assert reuse==0
          b=a+w1+[5,9]
          w2,reuse,_=req(p,b,3); ref2=oneshot(b,3)
          assert w2==ref2,(w2,ref2); assert reuse==len(a)+len(w1),(reuse,b)
          c=[3,7,12]
          w3,reuse,_=req(p,c,2); ref3=oneshot(c,2)
          assert w3==ref3,(w3,ref3); assert reuse==0
          p.stdin.write('RESET\n'); p.stdin.flush()
          for line in p.stdout:
              if line.startswith('@K3RESET'): break
          w4,reuse,_=req(p,a,5,1.0,.95,424242); ref4=oneshot(a,5,1.0,.95,424242)
          assert w4==ref4,(w4,ref4); assert reuse==0
          p.stdin.write('QUIT\n'); p.stdin.flush(); p.wait(timeout=10)
          assert p.returncode==0

          spec=importlib.util.spec_from_file_location('k3_local_worker_ci','local/k3_local.py')
          mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod
          spec.loader.exec_module(mod)
          cfg=mod.BackendConfig(
              model_dir=Path(MODEL), trunk_dir=Path(TRUNK), binary=Path('./bin/k3').resolve(),
              preset='laptop', cache_gb=.05, trunk_gb=.05,
              resident_worker=True, worker_binary=Path('./bin/k3-worker').resolve(),
              worker_context=64)
          backend=mod.ResidentCBackend(cfg)
          try:
              x,st1=backend.generate(a,max_tokens=2,temperature=0,top_p=1,seed=1,stop_id=-1)
              assert x==ref1 and st1['state_cache_hit_tokens']==0
              y,st2=backend.generate(b,max_tokens=3,temperature=0,top_p=1,seed=1,stop_id=-1)
              assert y==ref2 and st2['state_cache_hit_tokens']==len(a)+len(ref1), st2
          finally:
              backend.close()
          print('resident exact worker + Python bridge parity: PASS',w1,w2,w3,w4)
          PY
      - name: Resident sampled draft matches one-shot across warm turns
        run: |
          python - <<'PY'
          import importlib.util, json, subprocess, sys, tempfile
          from pathlib import Path

          MODEL='/tmp/k3tiny'; TRUNK='/tmp/k3tiny-trunk'; DRAFT='/tmp/k3tiny-draft'
          BASE=[MODEL,'--trunk',TRUNK,'--trunk-gb','0.05','--cache-gb','0.05']
          DARGS=['--draft-trunk',DRAFT,'--draft-trunk-gb','0.05','--draft-topk','1','--spec','2']

          def oneshot(ids, gen, seed):
              with tempfile.NamedTemporaryFile(suffix='.json') as f:
                  cmd=['./bin/k3',*BASE,*DARGS,'--ids',','.join(map(str,ids)),
                       '--gen',str(gen),'--incremental','--temperature','1','--top-p','.95',
                       '--seed',str(seed),'--out',f.name]
                  subprocess.run(cmd,check=True,stdout=subprocess.DEVNULL)
                  return json.load(open(f.name))['generated_ids']

          p=subprocess.Popen(['./bin/k3-worker',*BASE,'--context','64',*DARGS],
                             stdin=subprocess.PIPE,stdout=subprocess.PIPE,
                             stderr=subprocess.STDOUT,text=True,bufsize=1)
          assert p.stdin and p.stdout
          for line in p.stdout:
              if line.startswith('@K3READY '): break
          else: raise AssertionError('draft worker exited before READY')
          rid=0
          def req(ids, gen, seed):
              nonlocal_rid[0]+=1; r=nonlocal_rid[0]
              p.stdin.write(f'REQ {r} {len(ids)} {gen} 1 .95 {seed} -1\n')
              p.stdin.write(' '.join(map(str,ids))+'\n'); p.stdin.flush()
              out=[]; reuse=None; metrics=None
              for line in p.stdout:
                  if line.startswith(f'@K3TOKEN {r} '): out.append(int(line.split()[2]))
                  elif line.startswith(f'@K3DRAFT {r} '):
                      x=line.split(); metrics=(int(x[2]),int(x[3]),int(x[4]))
                  elif line.startswith(f'@K3ERROR {r} '): raise AssertionError(line)
                  elif line.startswith(f'@K3DONE {r} '):
                      reuse=int(line.split()[4]); break
              return out,reuse,metrics
          nonlocal_rid=[0]

          a=[3,7,11]
          w1,reuse,m1=req(a,6,987654); ref1=oneshot(a,6,987654)
          assert w1==ref1,(w1,ref1); assert reuse==0
          assert m1 and m1[0]>0 and m1[1]>0,m1
          # This second turn catches state-ahead bugs if the first max_tokens cut through
          # a speculative block: both exact and draft state must match only visible tokens.
          b=a+w1+[5,9]
          w2,reuse,m2=req(b,4,123456); ref2=oneshot(b,4,123456)
          assert w2==ref2,(w2,ref2)
          assert reuse==len(a)+len(w1),(reuse,len(a)+len(w1))
          assert m2 and m2[0]>0,m2
          p.stdin.write('QUIT\n'); p.stdin.flush(); p.wait(timeout=10)
          assert p.returncode==0

          spec=importlib.util.spec_from_file_location('k3_local_rd_ci','local/k3_local.py')
          mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod
          spec.loader.exec_module(mod)
          cfg=mod.BackendConfig(
              model_dir=Path(MODEL),trunk_dir=Path(TRUNK),binary=Path('./bin/k3').resolve(),
              preset='laptop',cache_gb=.05,trunk_gb=.05,resident_worker=True,
              worker_binary=Path('./bin/k3-worker').resolve(),worker_context=64,
              draft_trunk=Path(DRAFT),draft_trunk_gb=.05,draft_topk=1,spec=2)
          backend=mod.ResidentCBackend(cfg)
          try:
              x,stats=backend.generate(a,max_tokens=6,temperature=1,top_p=.95,
                                       seed=987654,stop_id=-1)
              assert x==ref1,(x,ref1)
              assert stats['draft_proposed']>0 and 'draft_acceptance' in stats,stats
          finally:
              backend.close()
          print('resident sampled draft warm-turn parity: PASS',w1,w2,m1,m2)
          PY
