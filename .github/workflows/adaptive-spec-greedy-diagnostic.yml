name: Diagnose greedy adaptive speculation

on:
  push:
    branches: [speedboost/adaptive-spec-greedy]
    paths:
      - '.github/workflows/adaptive-spec-greedy-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply transform and build
        run: |
          set -euo pipefail
          python tools/patch_spec_auto.py
          make clean
          make ARCH='-mavx2 -mfma' CFLAGS='-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -Werror -mavx2 -mfma -fopenmp -pthread -ffp-contract=off' -j2
      - name: Build tiny exact trunk
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          rm -rf /tmp/k3auto /tmp/k3auto-trunk /tmp/k3auto-out
          mkdir -p /tmp/k3auto-out
          python tools/make_tiny_checkpoint.py /tmp/k3auto --seed 2040 --prompt-ids 3,7,11,5,9,2,4,6,8,10,12,14
          NLAYERS=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/k3auto/config.json'))['num_hidden_layers'])
          PY
          )
          python tools/pack_trunk.py /tmp/k3auto /tmp/k3auto-trunk "$NLAYERS"
      - name: Run all decode variants and print diagnostics
        run: |
          set -uo pipefail
          D=/tmp/k3auto-out
          BASE='/tmp/k3auto --trunk /tmp/k3auto-trunk --trunk-gb 0.05 --cache-gb 0.01 --ids 3,7,11,5,9,2,4,6,8,10,12,14 --gen 18 --incremental --threads 1 --temperature 0'
          DRAFT='--draft-trunk /tmp/k3auto-trunk --draft-trunk-gb 0.05 --draft-topk 0'
          run_one() {
            name="$1"; shift
            set +e
            ./bin/k3 $BASE "$@" --out "$D/$name.json" >"$D/$name.log" 2>&1
            rc=$?
            set -e
            echo "===== $name rc=$rc ====="
            test -f "$D/$name.json" && echo "json=present" || echo "json=MISSING"
            tail -n 60 "$D/$name.log" || true
            echo
            return 0
          }
          run_one serial
          run_one fixed4 $DRAFT --spec 4
          run_one auto8 $DRAFT --spec-auto --spec 8
          run_one auto5 $DRAFT --spec-auto --spec 5
          python3 - <<'PY'
          import json, os
          d='/tmp/k3auto-out'
          names=['serial','fixed4','auto8','auto5']
          objs={}
          for n in names:
              p=f'{d}/{n}.json'
              print('\nJSON', n, 'exists=', os.path.exists(p))
              if os.path.exists(p):
                  try:
                      o=json.load(open(p)); objs[n]=o
                      keys=['generated_ids','full_ids','spec_auto','spec_auto_rounds','spec_auto_proposed','spec_auto_accepted','spec_auto_final','spec_auto_limit','spec_auto_grows','spec_auto_shrinks','seconds_per_token','hybrid_rounds','hybrid_drafted','hybrid_accepted']
                      for k in keys:
                          if k in o: print(k, '=', o[k])
                  except Exception as e: print('JSON parse error:',repr(e))
          if 'serial' in objs:
              s=objs['serial']
              for n in ['fixed4','auto8','auto5']:
                  if n not in objs: continue
                  o=objs[n]
                  for key in ['generated_ids','full_ids']:
                      a=s.get(key,[]); b=o.get(key,[])
                      ok=a==b
                      print(f'COMPARE {n} {key}:', ok, 'lens', len(a), len(b))
                      if not ok:
                          m=min(len(a),len(b)); pos=next((i for i in range(m) if a[i]!=b[i]), m)
                          print(' first_diff=',pos,'serial=',a[pos:pos+8],'other=',b[pos:pos+8])
          PY
          false
