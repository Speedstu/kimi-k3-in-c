name: Local K3 auto memory parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'local/k3_local.py'
      - 'tests/python/test_local_bridge.py'
      - '.github/workflows/local-auto-memory.yml'

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Local bridge and deterministic auto-memory gates
        run: |
          set -euo pipefail
          python -m pip install --quiet ruff numpy
          ruff check local/ tests/python/ --output-format=github
          python -m compileall -q local/ tests/python/
          python -m unittest discover -s tests/python -p 'test_*.py' -v
          python - <<'PY'
          from local.k3_local import _auto_worker_budgets
          t,c=_auto_worker_budgets(32.0,prefill_mb=256.0,worker_context=1024)
          assert t >= 18.0 and c == 0.5, (t,c)
          th,ch=_auto_worker_budgets(32.0,prefill_mb=256.0,worker_context=1048576)
          assert th > 14.0 and th < t and ch == 0.5, (th,ch)
          tf,cf=_auto_worker_budgets(192.0,prefill_mb=256.0,worker_context=1024)
          assert tf == 111.0 and cf > 0.5, (tf,cf)
          print('LOCAL AUTO MEMORY CONTRACT PASS', (t,c),(th,ch),(tf,cf))
          PY
      - name: Exact C oracle unchanged
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libomp-dev
          make clean
          make ARCH='-mavx2 -mfma' CFLAGS='-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -Werror -mavx2 -mfma -fopenmp -pthread -ffp-contract=off' -j2
          make ARCH='-mavx2 -mfma' CFLAGS='-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -Werror -mavx2 -mfma -fopenmp -pthread -ffp-contract=off' test -j2
