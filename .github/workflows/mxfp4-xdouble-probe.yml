name: MXFP4 xdouble probe

on:
  push:
    branches: [speedboost/mxfp4-xdouble-probe]
    paths:
      - 'benchmarks/bench_mxfp4_xdouble.c'
      - '.github/workflows/mxfp4-xdouble-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          set -euo pipefail
          make -j2
          cc -O3 -std=gnu99 -Wall -Wextra -Werror -mavx2 -mfma -fopenmp -pthread -ffp-contract=off \
             -Iinclude -Iinclude/k3 benchmarks/bench_mxfp4_xdouble.c build/src/core/k3_ops.o \
             -o /tmp/mx_xdouble -lm -fopenmp -pthread
      - name: One thread
        run: OMP_NUM_THREADS=1 /tmp/mx_xdouble
      - name: Two threads
        run: OMP_NUM_THREADS=2 /tmp/mx_xdouble
      - name: Four threads
        run: OMP_NUM_THREADS=4 /tmp/mx_xdouble
      - name: Eight threads
        run: OMP_NUM_THREADS=8 /tmp/mx_xdouble
