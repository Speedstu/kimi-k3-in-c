name: Stage resident bridge

on:
  push:
    branches: ['feature/resident-local-worker']
    paths:
      - 'tools/apply_resident_bridge_stage.py'
      - 'tools/fix_resident_bridge_lint_stage.py'
      - '.github/workflows/resident-bridge-stage.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/resident-local-worker
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply guarded bridge patch
        run: |
          python3 tools/apply_resident_bridge_stage.py
          python3 tools/fix_resident_bridge_lint_stage.py
      - name: Python syntax and lint
        run: |
          python -m pip install --quiet ruff
          python -m py_compile local/k3_local.py
          ruff check local/k3_local.py
      - name: Existing bridge contract smoke tests
        run: |
          python - <<'PY'
          import importlib.util, sys
          p='local/k3_local.py'
          spec=importlib.util.spec_from_file_location('k3_local_stage',p)
          mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod
          spec.loader.exec_module(mod)
          cfg=mod.BackendConfig(
              model_dir=mod.Path('/m'),trunk_dir=mod.Path('/t'),binary=mod.Path('/b'),
              resident_worker=True,worker_binary=mod.Path('/w'),worker_context=2048)
          assert cfg.resident_worker and cfg.worker_context==2048
          assert mod.ResidentCBackend._PRESET_BUDGETS['laptop']==(3.0,1.0)
          print('resident bridge structural smoke: PASS')
          PY
      - name: Commit validated bridge
        run: |
          git config user.name Speedstu
          git config user.email '164693733+Speedstu@users.noreply.github.com'
          git add local/k3_local.py
          git diff --cached --quiet || git commit -m 'feat: make resident C worker the default localhost backend'
          git push origin HEAD:feature/resident-local-worker
