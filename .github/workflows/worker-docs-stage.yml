name: Stage worker docs

on:
  push:
    branches: ['feature/resident-local-worker']
    paths:
      - 'tools/apply_worker_docs_stage.py'
      - '.github/workflows/worker-docs-stage.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/resident-local-worker
      - name: Apply guarded docs patch
        run: python3 tools/apply_worker_docs_stage.py
      - name: Docs contract
        run: |
          grep -q 'resident `bin/k3-worker`' local/README.md
          grep -q -- '--worker-context 1024' local/README.md
          grep -q -- '--no-resident-worker' local/README.md
      - name: Commit validated docs
        run: |
          git config user.name Speedstu
          git config user.email '164693733+Speedstu@users.noreply.github.com'
          git add local/README.md
          git diff --cached --quiet || git commit -m 'docs: make resident worker the default local K3 path'
          git push origin HEAD:feature/resident-local-worker
