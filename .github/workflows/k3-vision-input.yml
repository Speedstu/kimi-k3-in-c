name: K3 vision mixed-prefill parity

on:
  push:
    branches: [speedboost/k3-vision-input]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mixed-prefill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Apply mixed-prefill transform
        run: python tools/patch_k3_mixed_prefill.py

      - name: Strict AVX2 build and full oracle
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libomp-dev
          make clean
          make ARCH='-mavx2 -mfma' CFLAGS='-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -Werror -mavx2 -mfma -fopenmp -pthread -ffp-contract=off' -j2
          make ARCH='-mavx2 -mfma' CFLAGS='-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -Werror -mavx2 -mfma -fopenmp -pthread -ffp-contract=off' test -j2

      - name: Build exact tiny fixture and media sidecar
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy torch safetensors --index-url https://download.pytorch.org/whl/cpu || true
          python -m pip install --quiet numpy safetensors
          rm -rf /tmp/k3mm /tmp/k3mm-trunk /tmp/k3mm-q4 /tmp/k3mm-out
          mkdir -p /tmp/k3mm-out
          python tools/make_tiny_checkpoint.py /tmp/k3mm --seed 2600 --prompt-ids 3,7,11,6,5,9
          NLAYERS=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/k3mm/config.json'))['num_hidden_layers'])
          PY
          )
          python tools/pack_trunk.py /tmp/k3mm /tmp/k3mm-trunk "$NLAYERS"
          python tools/q4_trunk.py /tmp/k3mm-trunk /tmp/k3mm-q4
          python - <<'PY'
          import struct
          from safetensors.torch import load_file
          w=load_file('/tmp/k3mm/model.safetensors')['language_model.model.embed_tokens.weight']
          rows=w[[11,6]].float().contiguous().numpy()
          with open('/tmp/k3mm-out/media.bin','wb') as f:
              f.write(struct.pack('<8sIIII', b'K3MMF1\0', 1, rows.shape[1], 1, 0))
              f.write(struct.pack('<I', rows.shape[0]))
              f.write(rows.astype('<f4', copy=False).tobytes(order='C'))
          print('sidecar',rows.shape)
          PY

      - name: Two projected rows exactly reproduce two token embeddings
        run: |
          set -euo pipefail
          BASE='/tmp/k3mm --trunk /tmp/k3mm-trunk --trunk-gb 0.05 --cache-gb 0.01 --context 64 --threads 1'
          printf 'REQ 1 6 8 0 1 1 -1\n3 7 11 6 5 9\nQUIT\n' | ./bin/k3-worker $BASE > /tmp/k3mm-out/text.log 2>&1
          printf 'REQMM 2 5 8 0 1 1 -1 15 /tmp/k3mm-out/media.bin\n3 7 15 5 9\nQUIT\n' | ./bin/k3-worker $BASE > /tmp/k3mm-out/mm.log 2>&1
          python - <<'PY'
          def toks(path,rid):
              out=[]
              for line in open(path):
                  if line.startswith(f'@K3TOKEN {rid} '): out.append(int(line.split()[2]))
              return out
          a=toks('/tmp/k3mm-out/text.log',1); b=toks('/tmp/k3mm-out/mm.log',2)
          assert len(a)==8 and b==a,(a,b)
          print('MIXED PREFILL EXACT TOKEN-EQUIVALENCE PASS',a)
          PY

      - name: Draft speculation remains exact after mixed prefill
        run: |
          set -euo pipefail
          BASE='/tmp/k3mm --trunk /tmp/k3mm-trunk --trunk-gb 0.05 --cache-gb 0.01 --context 64 --threads 1'
          DRAFT='--draft-trunk /tmp/k3mm-q4 --draft-trunk-gb 0.05 --draft-topk 2 --spec 4'
          printf 'REQMM 3 5 8 0 1 1 -1 15 /tmp/k3mm-out/media.bin\n3 7 15 5 9\nQUIT\n' | ./bin/k3-worker $BASE $DRAFT > /tmp/k3mm-out/mm-draft.log 2>&1
          python - <<'PY'
          def toks(path,rid):
              return [int(x.split()[2]) for x in open(path) if x.startswith(f'@K3TOKEN {rid} ')]
          a=toks('/tmp/k3mm-out/text.log',1); b=toks('/tmp/k3mm-out/mm-draft.log',3)
          assert b==a,(a,b)
          print('MIXED PREFILL + VERIFIED DRAFT EXACT PASS',b)
          PY

      - name: Malformed or mismatched media fails closed
        run: |
          set -euo pipefail
          BASE='/tmp/k3mm --trunk /tmp/k3mm-trunk --trunk-gb 0.05 --cache-gb 0.01 --context 64 --threads 1'
          printf 'bad' >/tmp/k3mm-out/bad.bin
          printf 'REQMM 4 5 2 0 1 1 -1 15 /tmp/k3mm-out/bad.bin\n3 7 15 5 9\nQUIT\n' | ./bin/k3-worker $BASE > /tmp/k3mm-out/bad.log 2>&1
          grep -q '^@K3ERROR 4 2' /tmp/k3mm-out/bad.log
          printf 'REQMM 5 5 2 0 1 1 -1 14 /tmp/k3mm-out/media.bin\n3 7 15 5 9\nQUIT\n' | ./bin/k3-worker $BASE > /tmp/k3mm-out/mismatch.log 2>&1
          grep -q '^@K3ERROR 5 2' /tmp/k3mm-out/mismatch.log
          echo 'MIXED PREFILL FAIL-CLOSED PASS'

      - name: Persist validated C implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cli/k3_run.c src/cli/k3_worker.c
          git commit -m 'feat: add exact mixed text-media prefill path' || true
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}
