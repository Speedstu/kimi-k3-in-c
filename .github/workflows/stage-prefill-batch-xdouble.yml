name: Stage prefill batch xdouble helper

on:
  push:
    branches: [speedboost/prefill-batch-xdouble]
    paths:
      - '.github/workflows/stage-prefill-batch-xdouble.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply test-only helper
        run: |
          set -euo pipefail
          python3 .github/patches/stage_prefill_batch_xdouble.py
      - name: Strict build and regression suite
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libomp-dev
          make clean
          make ARCH='-mavx2 -mfma' CFLAGS='-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -Werror -mavx2 -mfma -fopenmp -pthread -ffp-contract=off' -j2
          make ARCH='-mavx2 -mfma' CFLAGS='-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -Werror -mavx2 -mfma -fopenmp -pthread -ffp-contract=off' test -j2
          cc -O2 -std=gnu99 -Wall -Wextra -Werror -mavx2 -mfma -fopenmp -pthread -ffp-contract=off -DK3_TEST_INTERNALS -Iinclude -Iinclude/k3 -c src/core/k3_ops.c -o /tmp/k3_ops_test.o
      - name: Commit test-only helper
        run: |
          set -euo pipefail
          git config user.name 'Speedstu'
          git config user.email '164693733+Speedstu@users.noreply.github.com'
          git add src/core/k3_ops.c
          git commit -m 'probe: add test-only batched MXFP4 xdouble helper'
          git push origin HEAD:speedboost/prefill-batch-xdouble
