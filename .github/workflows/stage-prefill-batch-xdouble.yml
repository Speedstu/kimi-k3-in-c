name: Stage production prefill batch xdouble

on:
  push:
    branches: [speedboost/prefill-batch-xdouble]
    paths:
      - '.github/workflows/stage-prefill-batch-xdouble.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply production integration
        run: |
          set -euo pipefail
          python3 .github/patches/stage_production_prefill_batch_xdouble.py
      - name: Strict AVX2 build and regression suite
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libomp-dev
          make clean
          make ARCH='-mavx2 -mfma' CFLAGS='-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -Werror -mavx2 -mfma -fopenmp -pthread -ffp-contract=off' -j2
          make ARCH='-mavx2 -mfma' CFLAGS='-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -Werror -mavx2 -mfma -fopenmp -pthread -ffp-contract=off' test -j2
          cc -O3 -std=gnu99 -Wall -Wextra -Werror -mavx2 -mfma -fopenmp -pthread -ffp-contract=off -DK3_TEST_INTERNALS -Iinclude -Iinclude/k3 -c src/core/k3_ops.c -o /tmp/k3_ops_test.o
          cc -O3 -std=gnu99 -Wall -Wextra -Werror -mavx2 -mfma -fopenmp -pthread -ffp-contract=off benchmarks/bench_prefill_batch_xdouble.c /tmp/k3_ops_test.o -o /tmp/prefill_batch_xd -lm -fopenmp -pthread
          OMP_NUM_THREADS=1 /tmp/prefill_batch_xd | grep -q 'PREFILL BATCH XDOUBLE EXACTNESS PASS'
      - name: Commit production source
        run: |
          set -euo pipefail
          git config user.name 'Speedstu'
          git config user.email '164693733+Speedstu@users.noreply.github.com'
          git add src/core/k3_ops.c
          git commit -m 'Reuse widened activations in exact MXFP4 prefill batches'
          git push origin HEAD:speedboost/prefill-batch-xdouble
