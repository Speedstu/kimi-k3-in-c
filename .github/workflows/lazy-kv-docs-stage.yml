name: Stage lazy KV docs

on:
  push:
    branches: ['feature/lazy-kv-bounded-prefill']
    paths:
      - 'tools/apply_lazy_kv_docs_stage.py'
      - '.github/workflows/lazy-kv-docs-stage.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/lazy-kv-bounded-prefill
      - name: Apply guarded docs patch
        run: python3 tools/apply_lazy_kv_docs_stage.py
      - name: Docs contract
        run: |
          grep -q '64-token chunks' local/README.md
          grep -q 'lazy anonymous virtual memory' local/README.md
          grep -q 'cached=0' local/README.md
      - name: Commit validated docs
        run: |
          git config user.name Speedstu
          git config user.email '164693733+Speedstu@users.noreply.github.com'
          git add local/README.md
          git diff --cached --quiet || git commit -m 'docs: explain lazy KV reservation and bounded resident prefill'
          git push origin HEAD:feature/lazy-kv-bounded-prefill
