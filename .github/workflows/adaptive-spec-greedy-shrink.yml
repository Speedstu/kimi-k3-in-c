name: Greedy adaptive speculation shrink probe

on:
  push:
    branches: [speedboost/adaptive-spec-greedy]
    paths:
      - '.github/workflows/adaptive-spec-greedy-shrink.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shrink:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply transform and build
        run: |
          set -euo pipefail
          python tools/patch_spec_auto.py
          make clean
          make ARCH='-mavx2 -mfma' CFLAGS='-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -Werror -mavx2 -mfma -fopenmp -pthread -ffp-contract=off' -j2
      - name: Build tiny exact trunk
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          rm -rf /tmp/k3shrink /tmp/k3shrink-trunk /tmp/k3shrink-out
          mkdir -p /tmp/k3shrink-out
          python tools/make_tiny_checkpoint.py /tmp/k3shrink --seed 2041 \
            --prompt-ids 3,7,11,5,9,2,4,6,8,10,12,14,16,18
          NLAYERS=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/k3shrink/config.json'))['num_hidden_layers'])
          PY
          )
          python tools/pack_trunk.py /tmp/k3shrink /tmp/k3shrink-trunk "$NLAYERS"
      - name: Reduced-topk draft triggers shrink but exact K3 sequence stays authoritative
        run: |
          set -euo pipefail
          D=/tmp/k3shrink-out
          BASE='/tmp/k3shrink --trunk /tmp/k3shrink-trunk --trunk-gb 0.05 --cache-gb 0.01 --ids 3,7,11,5,9,2,4,6,8,10,12,14,16,18 --gen 32 --incremental --threads 1 --temperature 0'
          ./bin/k3 $BASE --out "$D/serial.json" >"$D/serial.log" 2>&1
          ./bin/k3 $BASE --draft-trunk /tmp/k3shrink-trunk --draft-trunk-gb 0.05 \
            --draft-topk 1 --spec-auto --spec 8 --out "$D/auto.json" >"$D/auto.log" 2>&1
          python3 - <<'PY'
          import json
          d='/tmp/k3shrink-out'
          s=json.load(open(d+'/serial.json')); a=json.load(open(d+'/auto.json'))
          assert a['generated_ids'] == s['generated_ids'], (a['generated_ids'], s['generated_ids'])
          assert a['full_ids'] == s['full_ids']
          print('exact serial sequence parity: PASS')
          print('adaptive metrics:', {k:a[k] for k in [
              'spec_auto_rounds','spec_auto_proposed','spec_auto_accepted',
              'spec_auto_final','spec_auto_limit','spec_auto_grows','spec_auto_shrinks']})
          assert a['spec_auto_rounds'] > 0
          assert a['spec_auto_shrinks'] > 0, 'this fixture did not exercise shrink; choose a worse draft/seed'
          print('adaptive shrink path: PASS')
          PY
