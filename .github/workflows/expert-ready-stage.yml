name: Expert-ready source staging

on:
  push:
    branches: [speedboost/expert-ready-pipeline]
    paths:
      - '.github/workflows/expert-ready-stage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: speedboost/expert-ready-pipeline
      - name: Apply source patch
        run: python3 tools/expert_ready_stage_patch.py
      - name: Commit source and remove staging helpers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/expert-ready-stage.yml tools/expert_ready_stage_patch.py
          git add include/k3/k3.h src/cache/k3_cache.c src/cache/k3_cache.h src/core/k3_ops.c tests/unit/test_cache.c
          git commit -m 'perf: consume routed experts as their reads complete'
          git push origin HEAD:speedboost/expert-ready-pipeline
