name: MXFP4 pair probe

on:
  push:
    branches: [speedboost/mxfp4-pair-probe]
    paths:
      - 'benchmarks/bench_mxfp4_pair.c'
      - '.github/workflows/mxfp4-pair-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          set -euo pipefail
          cc -O3 -std=gnu99 -Wall -Wextra -Werror -mavx2 -mfma -fopenmp -pthread -ffp-contract=off benchmarks/bench_mxfp4_pair.c -o /tmp/mx_pair -lm -fopenmp -pthread
      - name: One thread
        run: OMP_NUM_THREADS=1 /tmp/mx_pair
      - name: Two threads
        run: OMP_NUM_THREADS=2 /tmp/mx_pair
      - name: Four threads
        run: OMP_NUM_THREADS=4 /tmp/mx_pair
      - name: Eight threads
        run: OMP_NUM_THREADS=8 /tmp/mx_pair
