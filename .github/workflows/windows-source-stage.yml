name: Windows source staging

on:
  push:
    branches: [feature/windows-native-runtime]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/windows-native-runtime
      - name: Update Windows README note once
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text()
          old='''**macOS, Windows, WSL?** The engine targets Linux. The tokenizer and config reader are\nportable C99 and are built portably in CI.\n'''
          new='''**macOS, Windows, WSL?** Linux remains the reference and macOS is CI-gated. Native\nWindows x64 now builds and runs through MSYS2 UCRT64/GCC, including `bin/k3-worker` and\ntiny exact/Q4 speculative parity. The current Windows storage path is a correctness\nbaseline, not yet a claim of Linux-`O_DIRECT` performance; see [docs/WINDOWS.md](docs/WINDOWS.md).\n'''
          n=s.count(old)
          if n == 0:
              if 'docs/WINDOWS.md' not in s:
                  raise SystemExit('README Windows FAQ pattern not found')
          elif n == 1:
              p.write_text(s.replace(old,new,1))
          else:
              raise SystemExit(f'refusing ambiguous README patch: {n} matches')
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: advertise gated native Windows runtime'
          git push origin HEAD:feature/windows-native-runtime

