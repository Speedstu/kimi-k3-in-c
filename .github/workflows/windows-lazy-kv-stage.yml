name: Windows lazy KV staging

on:
  push:
    branches: [feature/windows-lazy-kv]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/windows-lazy-kv
      - name: Apply worker VM patch once
        run: |
          python3 tools/_stage_windows_lazy_kv.py
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cli/k3_worker.c
          git commit -m 'perf(win): commit resident KV rows on demand'
          git push origin HEAD:feature/windows-lazy-kv
