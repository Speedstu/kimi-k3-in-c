name: Stage sampled speculation bridge

on:
  push:
    branches: [feature/exact-sampled-speculation]
    paths:
      - tools/apply_sampled_spec_bridge_stage.py
      - .github/workflows/sampled-spec-bridge-stage.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/exact-sampled-speculation
      - run: python3 tools/apply_sampled_spec_bridge_stage.py
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Bridge/docs gates
        run: |
          python -m pip install --quiet ruff
          ruff check local/ --output-format=github
          python -m compileall -q local/
          python - <<'PY'
          import ast
          p='local/k3_local.py'
          ast.parse(open(p).read())
          text=open(p).read()
          for flag in ['--draft-trunk','--draft-trunk-gb','--draft-topk','--spec']:
              assert flag in text
          assert 'p/q verification remains authoritative' in text
          print('local sampled-spec bridge: PASS')
          PY
          grep -q 'accepted with `min(1,p(y)/q(y))`' local/README.md
      - name: Commit source/docs
        run: |
          git config user.name Speedstu
          git config user.email '164693733+Speedstu@users.noreply.github.com'
          git add local/k3_local.py local/README.md
          git diff --cached --check
          git commit -m 'feat: expose exact sampled draft acceleration to local K3 [stage-applied]'
          git push origin HEAD:feature/exact-sampled-speculation
