name: Real-hardware autotune parity

on:
  pull_request:
    paths:
      - 'benchmarks/autotune.py'
      - '.github/workflows/autotune-parity.yml'
      - 'README.md'
      - 'docs/AUTOTUNE.md'
      - 'src/**'
      - 'include/**'
      - 'tools/make_tiny_checkpoint.py'
      - 'tools/pack_trunk.py'
  workflow_dispatch:

jobs:
  tiny-autotune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install tiny-checkpoint dependencies
        run: |
          python -m pip install --quiet numpy
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Strict AVX2 build
        run: |
          make clean
          make ARCH='-mavx2 -mfma' CFLAGS='-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -Werror -mavx2 -mfma -fopenmp -pthread -ffp-contract=off' -j2
      - name: Generate streamed tiny K3
        run: |
          rm -rf /tmp/k3tiny /tmp/k3trunk /tmp/k3tiny-alt-config.json
          python tools/make_tiny_checkpoint.py /tmp/k3tiny --seed 1234 --prompt-ids 3,7,11,5,9
          cp /tmp/k3tiny/config.json /tmp/k3tiny-alt-config.json
          NLAYERS=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/k3tiny/config.json'))['num_hidden_layers'])
          PY
          )
          python tools/pack_trunk.py /tmp/k3tiny /tmp/k3trunk "$NLAYERS"
      - name: Coordinate thread autotune preserves exact token stream
        run: |
          python benchmarks/autotune.py /tmp/k3tiny \
            --k3-bin ./bin/k3 \
            --repeats 1 \
            --compute-candidates 1,2 \
            --io-candidates 1,2 \
            --io-seed 1 \
            --out /tmp/autotune.json \
            -- \
            --trunk /tmp/k3trunk --trunk-gb 0.05 --cache-gb 0.001 \
            --ids 3,7,11,5,9 --gen 3 --incremental --temperature 0
          python - <<'PY'
          import json
          p='/tmp/autotune.json'
          x=json.load(open(p))
          assert x['recommended']['threads'] in (1,2)
          assert x['recommended']['async_io_threads'] in (1,2)
          assert 'draft_topk' not in x['recommended']
          assert x['draft_topk_candidates'] is None
          assert x['reference_generated_ids'] == [92,168,13], x['reference_generated_ids']
          assert len(x['runs']) >= 6, len(x['runs'])
          assert all(r['draft_topk'] is None for r in x['runs'])
          assert x['recommended']['samples_at_final_pair'] == x['recommended']['samples_at_final_configuration']
          print('THREAD AUTOTUNE PARITY PASS', x['recommended'])
          PY
      - name: Auto draft top-k candidates follow exact model config
        run: |
          python - <<'PY'
          from benchmarks.autotune import automatic_draft_topk_candidates
          assert automatic_draft_topk_candidates(1) == [1]
          assert automatic_draft_topk_candidates(2) == [1,2]
          assert automatic_draft_topk_candidates(6) == [1,2,4,6]
          assert automatic_draft_topk_candidates(8) == [1,2,4,8]
          print('AUTO CANDIDATE SHAPE PASS')
          PY
          python benchmarks/autotune.py /tmp/k3tiny \
            --k3-bin ./bin/k3 \
            --repeats 1 \
            --compute-candidates 1,2 \
            --io-candidates 1,2 \
            --io-seed 1 \
            --draft-topk-candidates auto \
            --draft-topk-seed 2 \
            --out /tmp/autotune-draft.json \
            -- \
            --config /tmp/k3tiny-alt-config.json \
            --trunk /tmp/k3trunk --trunk-gb 0.05 --cache-gb 0.01 \
            --draft-trunk /tmp/k3trunk --draft-trunk-gb 0.05 \
            --spec-auto --spec 8 \
            --ids 3,7,11,5,9 --gen 12 --incremental --temperature 0
          python - <<'PY'
          import json
          from pathlib import Path
          p='/tmp/autotune-draft.json'
          x=json.load(open(p))
          assert x['recommended']['threads'] in (1,2)
          assert x['recommended']['async_io_threads'] in (1,2)
          assert x['recommended']['draft_topk'] in (1,2)
          assert x['draft_topk_candidates'] == [1,2], x['draft_topk_candidates']
          assert x['draft_topk_exact_limit'] == 2, x['draft_topk_exact_limit']
          assert Path(x['draft_topk_source_config']) == Path('/tmp/k3tiny-alt-config.json').resolve()
          assert x['reference_generated_ids'][:3] == [92,168,13], x['reference_generated_ids']
          seen={r['draft_topk'] for r in x['runs']}
          assert seen == {1,2}, seen
          assert len(x['runs']) >= 10, len(x['runs'])
          assert all(r['generated_ids'] == x['reference_generated_ids'] for r in x['runs'])
          assert all(r['full_ids'] == x['reference_full_ids'] for r in x['runs'])
          print('AUTO DRAFT TOP-K AUTOTUNE PARITY PASS', x['recommended'])
          PY
      - name: Draft top-k tuner refuses ambiguous or invalid commands
        run: |
          set -euo pipefail
          set +e
          python benchmarks/autotune.py /tmp/k3tiny --k3-bin ./bin/k3 \
            --draft-topk-candidates auto -- \
            --trunk /tmp/k3trunk --ids 3,7,11,5,9 --gen 1 --incremental \
            >/tmp/no-draft.log 2>&1
          rc1=$?
          python benchmarks/autotune.py /tmp/k3tiny --k3-bin ./bin/k3 \
            --draft-topk-candidates auto -- \
            --trunk /tmp/k3trunk --draft-trunk /tmp/k3trunk --draft-topk 1 \
            --ids 3,7,11,5,9 --gen 1 --incremental \
            >/tmp/ambiguous.log 2>&1
          rc2=$?
          python benchmarks/autotune.py /tmp/k3tiny --k3-bin ./bin/k3 \
            --draft-topk-candidates auto -- \
            --config /tmp/does-not-exist.json \
            --trunk /tmp/k3trunk --draft-trunk /tmp/k3trunk \
            --ids 3,7,11,5,9 --gen 1 --incremental \
            >/tmp/bad-config.log 2>&1
          rc3=$?
          set -e
          test "$rc1" -eq 2
          test "$rc2" -eq 2
          test "$rc3" -eq 2
          grep -q 'requires --draft-trunk' /tmp/no-draft.log
          grep -q 'do not pass --draft-topk' /tmp/ambiguous.log
          grep -q 'cannot read K3 config' /tmp/bad-config.log
          echo 'draft top-k CLI/config guards: PASS'

  windows-python-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python syntax and CLI parsing
        shell: pwsh
        run: |
          python -m py_compile benchmarks/autotune.py
          python benchmarks/autotune.py --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
