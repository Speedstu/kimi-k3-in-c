name: Stage resident draft first-token fix

on:
  push:
    branches: ['feature/resident-sampled-draft']
    paths:
      - 'tools/fix_resident_draft_first_token_stage.py'
      - '.github/workflows/resident-draft-first-token-stage.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/resident-sampled-draft
      - name: Apply guarded ordering fix
        run: python3 tools/fix_resident_draft_first_token_stage.py
      - name: Build strict
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libomp-dev
          make ARCH='-mavx2 -mfma' CFLAGS='-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -mavx2 -mfma -fopenmp -pthread -ffp-contract=off -Werror' -j"$(nproc)"
      - name: Commit validated source
        run: |
          git config user.name Speedstu
          git config user.email '164693733+Speedstu@users.noreply.github.com'
          git add src/cli/k3_worker.c
          git diff --cached --quiet || git commit -m 'fix: sample resident first token from exact logits before draft prefill'
          git push origin HEAD:feature/resident-sampled-draft
