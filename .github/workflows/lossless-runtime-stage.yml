name: Stage lossless trunk runtime

on:
  push:
    branches:
      - speedboost/lossless-trunk-codec

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'stage lossless trunk final validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Final source cleanup and CMake parity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/io/k3_trunk.c')
          s = p.read_text()
          s = s.replace('int64_t ring_slot = 0, spent = 0;', 'int64_t ring_slot = 0;')
          s = s.replace('if (rs == ring_slot && np == npin) { ring_slot = rs; spent = sp; break; }',
                        'if (rs == ring_slot && np == npin) { ring_slot = rs; break; }')
          s = s.replace('ring_slot = rs; npin = np; spent = sp;', 'ring_slot = rs; npin = np;')
          p.write_text(s)

          p = Path('CMakeLists.txt')
          s = p.read_text()
          old = 'k3_add_test(test_tok    tests/unit/test_tok.c)\n'
          assert s.count(old) == 1
          s = s.replace(old, old + 'k3_add_test(test_trunk_codec tests/unit/test_trunk_codec.c)\n')
          old = 'add_test(NAME scale      COMMAND scale_test)\n'
          assert s.count(old) == 1
          s = s.replace(old, 'add_test(NAME trunk_codec COMMAND test_trunk_codec)\n' + old)
          p.write_text(s)
          PY

      - name: Python lint and syntax
        run: |
          pip install --quiet ruff
          ruff check tools/lossless_trunk.py --output-format=github
          python3 -m py_compile tools/lossless_trunk.py

      - name: Strict warnings build
        run: |
          make clean
          make portable CFLAGS="-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -Werror -fopenmp -pthread -ffp-contract=off" -j2

      - name: Makefile tests
        run: make test -j2

      - name: CMake build and ctest
        run: |
          cmake -S . -B /tmp/k3-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/k3-cmake -j2
          ctest --test-dir /tmp/k3-cmake --output-on-failure

      - name: Portable scalar codec gate
        run: |
          cc -O2 -std=c99 -Wall -Wextra -Werror -Iinclude -Iinclude/k3 -Isrc/io \
             tests/unit/test_trunk_codec.c -o /tmp/test_codec
          /tmp/test_codec

      - name: Install tiny-checkpoint Python deps
        run: |
          python3 -m pip install --quiet numpy
          python3 -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: End-to-end raw vs lossless tiny trunk
        run: |
          rm -rf /tmp/k3tiny /tmp/k3raw /tmp/k3loss
          python3 tools/make_tiny_checkpoint.py /tmp/k3tiny --prompt-ids 3,7,11,5,9
          python3 tools/pack_trunk.py /tmp/k3tiny /tmp/k3raw 13
          python3 tools/lossless_trunk.py /tmp/k3raw /tmp/k3loss

          ./bin/k3 /tmp/k3tiny --ids 3,7,11,5,9 --gen 3 --incremental \
            --trunk /tmp/k3raw --trunk-gb 0.05 --cache-gb 0.02 \
            --dump-logits /tmp/raw_logits.bin --out /tmp/raw.json > /tmp/raw.log
          ./bin/k3 /tmp/k3tiny --ids 3,7,11,5,9 --gen 3 --incremental \
            --trunk /tmp/k3loss --trunk-gb 0.05 --cache-gb 0.02 \
            --dump-logits /tmp/loss_logits.bin --out /tmp/loss.json > /tmp/loss.log

          cmp /tmp/raw_logits.bin /tmp/loss_logits.bin
          python3 - <<'PY'
          import json
          a = json.load(open('/tmp/raw.json'))
          b = json.load(open('/tmp/loss.json'))
          for k in ('prompt_ids', 'generated_ids', 'full_ids', 'layers'):
              assert a[k] == b[k], (k, a[k], b[k])
          print('END-TO-END LOSSLESS TRUNK: PASS')
          print('generated_ids:', a['generated_ids'])
          PY
          grep -q 'lossless dict15 blocks' /tmp/loss.log
          grep -q 'reconstructed' /tmp/loss.log
          tail -40 /tmp/loss.log

      - name: Commit validated source cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/io/k3_trunk.c CMakeLists.txt
          git commit -m "test: gate lossless trunk through both build systems"
          git push origin HEAD:speedboost/lossless-trunk-codec
