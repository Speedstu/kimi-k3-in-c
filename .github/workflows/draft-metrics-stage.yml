name: Stage sampled draft metrics

on:
  push:
    branches: [feature/exact-sampled-speculation]
    paths:
      - tools/apply_draft_metrics_stage.py
      - benchmarks/draft-sweep.sh
      - .github/workflows/draft-metrics-stage.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/exact-sampled-speculation
      - name: Apply guarded metrics patch
        run: python3 tools/apply_draft_metrics_stage.py
      - name: Build and unit gates
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libomp-dev shellcheck
          make ARCH='-mavx2 -mfma' -j"$(nproc)"
          make ARCH='-mavx2 -mfma' test -j"$(nproc)"
          shellcheck -S warning benchmarks/draft-sweep.sh
          chmod +x benchmarks/draft-sweep.sh
      - name: Metrics appear in result JSON source contract
        run: |
          grep -q 'draft_acceptance' src/cli/k3_run.c
          grep -q 'draft_seconds' src/cli/k3_run.c
          grep -q 'verify_seconds' src/cli/k3_run.c
          grep -q 'RECOMMENDED:' benchmarks/draft-sweep.sh
      - name: Commit validated source and executable benchmark
        run: |
          git config user.name Speedstu
          git config user.email '164693733+Speedstu@users.noreply.github.com'
          git add src/cli/k3_run.c benchmarks/draft-sweep.sh
          git update-index --chmod=+x benchmarks/draft-sweep.sh
          git diff --cached --check
          git commit -m 'bench: measure and autotune exact sampled draft settings [stage-applied]'
          git push origin HEAD:feature/exact-sampled-speculation
