name: Stage local bridge lint cleanup

on:
  push:
    branches: [feature/local-k3-max-parity]
    paths:
      - tools/apply_local_lint_stage.py
      - .github/workflows/local-lint-stage.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/local-k3-max-parity
      - run: python3 tools/apply_local_lint_stage.py
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Lint and tests
        run: |
          python -m pip install --quiet ruff
          ruff check local/ tests/python/ --output-format=github
          python -m compileall -q local/ tests/python/
          python -m unittest discover -s tests/python -p 'test_*.py' -v
      - name: Commit source
        run: |
          git config user.name Speedstu
          git config user.email '164693733+Speedstu@users.noreply.github.com'
          git add local/k3_local.py
          git diff --cached --check
          git commit -m 'style: clean local K3 bridge lint [stage-applied]'
          git push origin HEAD:feature/local-k3-max-parity
