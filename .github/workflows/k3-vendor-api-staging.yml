name: K3 vendor API compatibility staging

on:
  push:
    branches: [speedboost/k3-official-verifier]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply Vendor Verifier API transform
        run: python tools/patch_k3_vendor_api.py
      - name: Run bridge regression suite
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy
          python -m compileall -q local/ tests/python/
          python -m unittest discover -s tests/python -p 'test_*.py' -v
      - name: Persist validated API behavior
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local/k3_local.py local/k3_vision.py tests/python/test_local_bridge.py
          git commit -m 'feat: match Moonshot K3 vendor API parameter contract' || true
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}
