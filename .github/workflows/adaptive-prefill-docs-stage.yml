name: Stage adaptive prefill docs

on:
  push:
    branches: ['feature/adaptive-prefill-chunk']
    paths:
      - 'tools/apply_adaptive_prefill_docs_stage.py'
      - '.github/workflows/adaptive-prefill-docs-stage.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/adaptive-prefill-chunk
      - name: Apply guarded docs patch
        run: python3 tools/apply_adaptive_prefill_docs_stage.py
      - name: Docs contract
        run: |
          grep -q -- '--prefill-mb 256' local/README.md
          grep -q 'benchmarks/prefill-sweep.py' local/README.md
          grep -q 'manual 1/16/64/128' local/README.md
      - name: Commit validated docs
        run: |
          git config user.name Speedstu
          git config user.email '164693733+Speedstu@users.noreply.github.com'
          git add local/README.md
          git diff --cached --quiet || git commit -m 'docs: explain adaptive resident prefill tuning'
          git push origin HEAD:feature/adaptive-prefill-chunk
